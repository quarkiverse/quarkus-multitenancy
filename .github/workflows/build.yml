name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
#        os: [windows-latest, macos-latest, ubuntu-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Prepare PostgreSQL image
        timeout-minutes: 5
        run: |
          primary_image="public.ecr.aws/docker/library/postgres:18"
          fallback_image="docker.io/library/postgres:18"

          if docker pull "$primary_image"; then
            exit 0
          fi

          echo "::warning::PostgreSQL pull from ECR failed; trying Docker Hub."
          if ! docker pull "$fallback_image"; then
            echo "::error::Unable to pull PostgreSQL 18 from either ECR or Docker Hub."
            exit 1
          fi

          # Testcontainers expects the ECR image name, even when Docker Hub supplied it.
          docker tag "$fallback_image" "$primary_image"

      - name: Build with Maven
        run: mvn -B clean install -Dno-format

      - name: Build with Maven (Native)
        run: mvn -B install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip
